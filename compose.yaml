name: corestack

services:
    postgres:
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        ports:
            - '5432:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}',
                ]
            interval: 5s
            timeout: 5s
            retries: 5

    mongodb:
        image: mongo:7.0
        restart: unless-stopped
        ports:
            - '27017:27017'
        volumes:
            - mongodb_data:/data/db
        healthcheck:
            test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
            interval: 5s
            timeout: 5s
            retries: 5

    mongo-express:
        image: mongo-express:latest
        restart: unless-stopped
        ports:
            - '8081:8081'
        environment:
            ME_CONFIG_MONGODB_SERVER: mongodb
            ME_CONFIG_MONGODB_PORT: 27017
            ME_CONFIG_BASICAUTH: 'false'
        depends_on:
            mongodb:
                condition: service_healthy

    app:
        build:
            context: .
            dockerfile: Dockerfile
        restart: unless-stopped
        ports:
            - '${PORT}:3000'
        environment:
            PORT: ${PORT}
            NODE_ENV: ${NODE_ENV}
            LOG_LEVEL: ${LOG_LEVEL}
            API_BASE_URL: ${API_BASE_URL}
            CORS_ORIGINS: ${CORS_ORIGINS}
            RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW}
            RATE_LIMIT_REQUEST: ${RATE_LIMIT_REQUEST}
            DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
            DATABASE_PROVIDER: ${DATABASE_PROVIDER}
            MONGODB_URI: ${MONGODB_URI}
            JWT_SECRET: ${JWT_SECRET}
            JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
            REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS}
            SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS}
            REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME}
            REFRESH_COOKIE_SAME_SITE: ${REFRESH_COOKIE_SAME_SITE}
            REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE}
            RESEND_API_KEY: ${RESEND_API_KEY}
            RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
            EMAIL_VERIFICATION_TTL_SECONDS: ${EMAIL_VERIFICATION_TTL_SECONDS}
            PASSWORD_RESET_TTL_SECONDS: ${PASSWORD_RESET_TTL_SECONDS}
        depends_on:
            postgres:
                condition: service_healthy
            mongodb:
                condition: service_healthy

volumes:
    postgres_data:
    mongodb_data:
