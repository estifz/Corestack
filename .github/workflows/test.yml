name: Tests & Build

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        name: Run Tests & Verify Docker Build
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: test
                    POSTGRES_PASSWORD: test
                    POSTGRES_DB: corestack_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 11

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: 'pnpm'

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Generate Database Client
              run: pnpm db:generate

            - name: Apply Database Migrations
              env:
                  DATABASE_URL: postgresql://test:test@localhost:5432/corestack_test
              run: pnpm migration:deploy

            - name: Run Vitest Suite
              env:
                  TEST_DATABASE_URL: postgresql://test:test@localhost:5432/corestack_test
              run: pnpm test

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Verify Docker Production Build
              uses: docker/build-push-action@v6
              with:
                  context: .
                  load: true
                  tags: corestack:ci
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
